name: Release

on:
  push:
    branches: [main-1] # every merge to the default branch -> TestFlight (beta)
    tags: ["v*"] # a vX.Y.Z tag -> TestFlight + submit to App Store review (release)
  workflow_dispatch: # manual run with an explicit lane choice
    inputs:
      lane:
        description: "Lane to run"
        type: choice
        options: [beta, release]
        default: beta

# Never cancel a half-finished upload; let an in-flight run complete.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby + cache gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Set up SSH for the signing (match) repo
        env:
          MATCH_SSH_KEY: ${{ secrets.MATCH_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$MATCH_SSH_KEY" > ~/.ssh/match_ed25519
          chmod 600 ~/.ssh/match_ed25519
          printf '%s\n' \
            'Host github.com' \
            '  IdentityFile ~/.ssh/match_ed25519' \
            '  IdentitiesOnly yes' \
            '  StrictHostKeyChecking accept-new' >> ~/.ssh/config

      - name: Decide lane + version
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LANE="${{ inputs.lane }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            LANE="release"
          else
            LANE="beta"
          fi
          echo "lane=$LANE" >> "$GITHUB_OUTPUT"
          # On a tag push, derive the marketing version (v1.2.0 -> 1.2.0).
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
          echo "Running lane=$LANE"

      - name: Run fastlane (${{ steps.plan.outputs.lane }})
        run: bundle exec fastlane ${{ steps.plan.outputs.lane }}
        env:
          # App Store Connect API key (App Manager role)
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }} # base64 of the .p8
          # fastlane match (signing storage) — cloned over SSH via the deploy key set up above
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          # Marketing version for a tag-triggered release (empty for beta).
          APP_VERSION: ${{ steps.plan.outputs.version }}
          # GITHUB_RUN_NUMBER is injected automatically and becomes the build number.
